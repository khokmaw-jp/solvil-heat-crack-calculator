<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08265f"><meta name="description" content="窓ガラスとフィルムの条件から熱割れリスクを確認するSolvilの業務用ツールです。"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="熱割れ計算"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icons/icon-192.png"><link rel="stylesheet" href="/styles.css"><title>Solvil 熱割れリスク計算</title></head>
<body><div class="app-shell"><header class="app-header"><a class="brand" href="#home">Solvil</a><div class="network-status" id="networkStatus" aria-live="polite"><i></i><span id="networkText">接続を確認中</span></div></header><main><section class="hero" id="home"><div class="window-lines"></div><h1>熱割れリスク計算</h1><p>窓ガラスとフィルムの条件から、施工判断に必要な熱割れリスクを参考値として確認します。</p><button class="primary-action" id="startCalculation"><b>＋</b><span>新規計算を始める</span><em>›</em></button><button class="secondary-action" data-view="history"><b>↺</b><span>計算履歴</span><em>›</em></button></section><section class="recent"><div class="section-heading"><h2>最近の計算</h2><button class="text-action" data-view="history">すべて見る ›</button></div><div id="historyList"></div></section><aside class="notice"><strong>△</strong><p>本計算結果は参考値であり、熱割れの発生を防止することを保証するものではありません。</p></aside><button class="install-card" id="installButton" hidden><b>↓</b><span><strong>この端末にインストール</strong><small>ホーム画面からすぐに起動できます</small></span><em>›</em></button></main><nav class="bottom-nav"><button class="active" data-view="home"><span>⌂</span><small>ホーム</small></button><button data-view="history"><span>◷</span><small>履歴</small></button><button data-view="settings"><span>⚙</span><small>設定</small></button></nav></div><dialog id="infoDialog"><form method="dialog"><button class="dialog-close" aria-label="閉じる">×</button><h2 id="dialogTitle">準備中</h2><p id="dialogMessage"></p><button class="dialog-confirm">確認</button></form></dialog><script type="module" src="/app.js"></script></body></html>
